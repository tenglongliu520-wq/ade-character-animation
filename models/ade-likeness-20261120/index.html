<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><script type="module">import{Ade3DAvatar}from'./avatar-3d.js';const stage=document.querySelector('#stage'),status=document.querySelector('#status');const avatar=new Ade3DAvatar(stage);window.adeCandidate=avatar;try{await avatar.ready;avatar.setPaused(true);status.textContent='形象修订候选 · 可旋转查看 · 尚未验收';document.querySelectorAll('[data-view]').forEach(b=>{b.disabled=false;b.addEventListener('click',()=>avatar.setView(b.dataset.view))})}catch(e){status.textContent='模型加载失败，请使用本目录 preview.py 启动预览';console.error(e)}</script></html>
