<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><script type="module">import{Ade3DAvatar}from'./avatar-3d.js';const stage=document.querySelector('#stage'),status=document.querySelector('#status'),reference=document.querySelector('figure img');const avatar=new Ade3DAvatar(stage);window.adeCandidate=avatar;try{await avatar.ready;avatar.setPaused(true);status.textContent='本轮三维模型 · 尚未验收';document.querySelectorAll('[data-view]').forEach(b=>{b.disabled=false;b.addEventListener('click',()=>{avatar.setView(b.dataset.view);const src={front:'reference-front.png',rightQuarter:'reference-right.png',leftQuarter:'reference-left.png'}[b.dataset.view];if(src)reference.src=src})})}catch(e){status.textContent='模型加载失败，请使用本目录 preview.py 启动预览';console.error(e)}</script></html>
