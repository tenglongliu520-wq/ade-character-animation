<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阿德人物动画演示</title><style>body{font:17px/1.7 system-ui;max-width:950px;margin:24px auto;padding:0 20px;color:#214636;background:#f6f7ef}.layout{display:flex;gap:24px;flex-wrap:wrap}.avatar{width:min(360px,100%);aspect-ratio:2/3}canvas{width:100%;height:100%}.controls{flex:1;min-width:260px}button{font:inherit;padding:8px 14px;margin:4px;border:1px solid #b5c5b5;border-radius:12px;background:white;color:inherit}audio{width:100%}input{max-width:100%}</style><h1>阿德 · 人物动画演示</h1><div class="layout"><div class="avatar" id="avatar" role="img" aria-label="浅绿色古装阿德"></div><div class="controls"><p id="status" role="status">正在加载人物素材…</p><div id="modes"><button data-mode="idle">待机</button><button data-mode="listen">倾听</button><button data-mode="think">思考</button><button data-mode="wave">挥手</button></div><button id="pause">暂停动作</button><h2>音频联动</h2><p>选择本地音频后点击播放器播放，嘴型随真实音量变化。文件仅在浏览器播放，不上传。</p><label>本地音频 <input id="file" type="file" accept="audio/*"></label><p><button id="sample">试听 I / M09（需同级语音仓库）</button></p><audio id="audio" controls></audio><p>停止、暂停或音频出错时闭嘴。减少动态设置下保持静态。</p></div></div><script src="/src/web/ade-motion-model.js"></script><script src="/src/web/companion-avatar.js"></script><script src="/examples/preview.js"></script></html>
